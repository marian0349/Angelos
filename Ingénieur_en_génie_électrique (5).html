<title>Ingénieur en génie électrique</title>
<style>:root{--navy:#16273b;--navy2:#233f5c;--blue:#4f86b8;--sky:#86b3d6;--bg:#f2f5f8;--ink:#1b2a3d;--mut:#64748b;--line:#dde5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
nav{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding:14px 5vw;position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:10px}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px}
.logo svg{width:26px;height:26px;fill:var(--sky)}
nav ul{list-style:none;display:flex;gap:28px;padding:0;flex-wrap:wrap}
nav li a{font-size:14px;padding:6px 0;border-bottom:2px solid transparent;opacity:.9}
nav li a.on{border-color:var(--sky);color:var(--sky)}
.hero{background:linear-gradient(100deg,var(--navy) 45%,rgba(22,39,59,.2)),linear-gradient(160deg,#f6a15a 0%,#8fb0c9 28%,#27435f 50%,#16273b 100%);color:#fff;padding:70px 5vw 40px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(22,39,59,.96) 30%,rgba(22,39,59,.6) 70%,rgba(22,39,59,.45))}
.bg{position:absolute;inset:0;overflow:hidden}
.track{display:flex;height:100%;width:max-content;animation:slide 40s linear infinite}
.track i{flex:none;width:360px;height:100%;margin-right:10px}
@keyframes slide{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
.hero-in{display:flex;gap:60px;align-items:center;max-width:1100px;margin:auto;position:relative;z-index:1;flex-wrap:wrap}
.avatar{width:190px;height:190px;border-radius:50%;border:4px solid var(--sky);background:radial-gradient(circle at 50% 38%,#c98f6a 0 22%,transparent 23%),radial-gradient(ellipse at 50% 105%,#2f5479 0 38%,transparent 39%),#a9bfce;box-shadow:0 0 0 8px rgba(134,179,214,.2);flex:none}
.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:6px 0 14px}
.hero .hi{color:var(--sky);font-size:17px}
.tags{font-weight:600;font-size:15px;margin-bottom:14px}.tags i{color:var(--sky);margin:0 10px;font-style:normal}
.hero p.d{max-width:480px;font-size:14px;opacity:.85;margin-bottom:24px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:30px;padding:13px 26px;font-weight:600;display:inline-flex;gap:10px;align-items:center}
.btn:hover{background:#6397c7}
.feats{display:flex;gap:40px;max-width:1100px;margin:50px auto 0;position:relative;z-index:1;flex-wrap:wrap}
.feats div{display:flex;gap:12px;align-items:center;font-size:13px}
.feats b{width:42px;height:42px;border:1px solid var(--sky);border-radius:50%;display:grid;place-items:center;color:var(--sky);font-size:18px;background:rgba(134,179,214,.12)}
.band{position:relative;overflow:hidden}
.band:before,.band:after{content:"";position:absolute;inset:0}
.band>div{position:relative;z-index:1}
.band.img:before{background:var(--bg) var(--pos,center)/cover}
.band.img:after{background:linear-gradient(100deg,rgba(22,39,59,.9) 20%,rgba(22,39,59,.4) 75%,rgba(22,39,59,.2))}
.band.light{color:var(--ink)}
.band.light:after{background:linear-gradient(100deg,rgba(255,255,255,.8) 25%,rgba(255,255,255,.35) 75%,rgba(255,255,255,.1))}
.band.light .ic{color:var(--navy2)}
[hidden]{display:none!important}
.band{background:linear-gradient(110deg,var(--navy),var(--navy2) 60%,#3f6f9c);color:#fff;padding:34px 5vw}
.band div{max-width:1100px;margin:auto;display:flex;gap:22px;align-items:center}
.band .ic{font-size:44px;color:var(--sky)}
.band h2{font-size:26px}.band p{font-size:14px;opacity:.85}
main{max-width:1100px;margin:auto;padding:36px 5vw 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 6px 18px rgba(22,39,59,.08);display:flex;flex-direction:column;gap:10px;text-align:left;color:inherit}
.img{height:150px;border-radius:5px}
.i1{background:radial-gradient(circle at 30% 40%,#2b6d3f 0 18%,transparent 19%),repeating-linear-gradient(90deg,#14502c 0 10px,#0f3a20 10px 20px)}
.i2{background:radial-gradient(circle at 60% 50%,#b9822b 0 14%,transparent 15%),repeating-linear-gradient(45deg,#2a2f33 0 12px,#1b1f22 12px 24px)}
.i3{background:radial-gradient(circle at 50% 50%,#d6d9de 0 12%,transparent 13%),repeating-linear-gradient(0deg,#1d7a4c 0 12px,#156038 12px 24px)}
.p1{background:linear-gradient(#a3c3da 0 45%,#5f9e45 45%);position:relative}
.p2{background:linear-gradient(135deg,#3f73a3,#27496d);border:6px solid #8a6f4d}
.p3{background:repeating-linear-gradient(110deg,#27435f 0 22px,#6f97bd 22px 24px),#27435f}
.card h3{font-size:14px;line-height:1.3}.card p{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#e6edf4;color:#35648f;font-size:11px;padding:3px 10px;border-radius:4px}
.more{color:var(--blue);font-weight:600;font-size:12px;margin-top:auto}
.back{color:var(--blue);font-size:13px;display:inline-block;margin-bottom:18px}
.det{display:grid;grid-template-columns:1.1fr 1fr;gap:30px}
.det .img{height:260px}
.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs i{flex:1;height:46px;border-radius:4px;background:#1c5e3a}
.det h1{font-size:24px;margin-bottom:10px}
.det h4{margin:18px 0 6px;font-size:15px}
.det ul{padding-left:20px;font-size:13px;color:var(--mut)}
.side{display:flex;flex-direction:column;gap:16px}
.box{background:#e8eff5;border-radius:8px;padding:16px;font-size:13px}
.box h4{margin:0 0 8px;color:var(--navy2)}
.box li{list-style:none;padding:3px 0}.ok li:before{content:"✔ ";color:var(--blue)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:26px 0 16px;font-size:13px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:8px 2px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.list .row{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:12px}
.pdf{width:34px;height:42px;border:2px solid #e24a4a;border-radius:4px;color:#e24a4a;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.row div{flex:1}.row b{font-size:14px}.row small{display:block;color:var(--mut);font-size:12px}
.dl{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:5px;padding:6px 12px;font-size:12px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px}
.contact .card{align-items:center;text-align:center;padding:26px 14px}
.contact .ci{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.cta{background:var(--navy);color:#fff;text-align:center;padding:40px 5vw;font-size:15px}
footer{background:var(--navy);color:#fff;display:flex;justify-content:flex-end;align-items:center;padding:22px 5vw;flex-wrap:wrap;gap:14px;border-top:1px solid rgba(255,255,255,.1)}
footer ul{list-style:none;padding:0;display:flex;gap:26px;font-size:13px;flex-wrap:wrap}
@media(max-width:760px){.det{grid-template-columns:1fr}.hero-in{gap:26px}nav ul{gap:16px}}
@media(prefers-reduced-motion:no-preference){.view{animation:f .3s}@keyframes f{from{opacity:0}}}
.ab{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start}.ab .avatar{width:200px;height:200px}.ab p{margin-bottom:12px}.ab h3{margin:20px 0 8px}.ab li{margin-left:18px;font-size:14px;color:var(--mut)}
.abox,.adm{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px;max-width:680px}
.adm label,.abox label{display:grid;gap:4px;font-size:13px;font-weight:600}
.adm input,.adm textarea,.adm select,.abox input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;width:100%}
.adm .row2{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.adm .at{display:flex;gap:10px;flex-wrap:wrap}.adm .at span{position:relative;width:90px;height:64px;border-radius:5px;background:center/cover}
.adm .at b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#b23a3a;color:#fff;text-align:center;font-size:14px;line-height:20px;cursor:pointer}
.dang{background:#b23a3a!important;padding:7px 14px!important}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:6px}
footer a{text-decoration:underline}
@media(max-width:760px){.ab{grid-template-columns:1fr}}
.fprev{height:90px;border-radius:6px;border:1px solid var(--line)}
.adm .sm{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;cursor:pointer}
.adm .sm.dang{color:#fff;border:0}
.adm b{margin-top:6px}
.flogo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);font-size:16px;line-height:1;text-decoration:none!important;color:#fff;cursor:pointer;vertical-align:middle}
a.flogo:hover{background:rgba(134,179,214,.25);border-color:var(--sky)}
.flogo.off{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--sky)}
.hero .btn+.btn{margin-left:10px}
.hero p.d+.btn,.hero .btn{margin-bottom:6px}
</style>
</head>

const $=s=>document.querySelector(s);
function bg(){document.querySelectorAll('.band[data-k]').forEach(b=>{const f=FONDS[b.dataset.k];b.classList.toggle('img',!!f);b.classList.toggle('light',!!(f&&f.light));if(f){b.style.setProperty('--bg','url("'+f.src+'")');b.style.setProperty('--pos',f.pos||'center')}})}

const chips=a=>`<div class="chips">${a.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`;
const CAT={ELEC,PV};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function route(){

 document.querySelectorAll('.thumbs i').forEach(t=>t.onclick=()=>{$('#gmain').style.background=`url('${t.dataset.s}') center/cover`});

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[target=_blank]');if(!a||e.defaultPrevented)return;e.preventDefault();const w=window.open(a.href,'_blank');if(w){try{w.opener=null}catch(x){}}else location.href=a.href});

 let b=[...S,...(inc?(S.length?all.filter(p=>p.imgs&&p.imgs[0]):all):[]).map(pi)];if(!b.length)b=all.map(pi);
 const half=[];while(half.length<8)half.push(...b);return{h:[...half,...half].join(''),d:Math.max(40,half.length*5)}}

 }else if(tab==='apropos'){const a=SITE.apropos;
  b=inp('ap_texte','Présentation (un paragraphe par ligne)',a.texte.join('\n'),6)+inp('ap_comp','Compétences (séparées par des virgules)',a.competences.join(', '))+inp('ap_parc','Parcours (une ligne par étape)',a.parcours.join('\n'),5)+`<label>Photo de la page À propos<input type="file" id="ap_photo" accept="image/*"></label><small>Sans photo ici, celle de la page Accueil est utilisée.</small>`+(a.photo?'<button class="btn dang" id="ap_nophoto">Retirer la photo</button>':'')+'<small>Ton CV se téléverse directement sur la page « À propos » : connecte-toi ici, puis ouvre cette page.</small>'+'<button class="btn" id="ap_save">Enregistrer</button>';
 }else if(tab==='pages'){

 }else if(tab==='add'||tab==='edit'){
  const p=tab==='edit'?ref(sel0):null,cat=tab==='edit'&&sel0?sel0.split('/')[0]:'ELEC';

const collectA=()=>{const h=SITE.accueil;h.salut=val('a_salut');h.titre=$('#a_titre').value.trim();h.tags=val('a_tags');h.texte=$('#a_texte').value.trim();h.bouton=val('a_bouton');h.features=[...document.querySelectorAll('.a_f')].map(x=>x.value.trim())};

function cvBind(){const A=$('#app');

function fsave(){
 const t=val('ft');if(!t){flash='Le titre est obligatoire.';return draw()}
 const cat=$('#fcat').value,old=tab==='edit'&&ref(sel0)||{};
 const np={t,d:val('fd'),det:$('#fx').value.trim(),tags:val('fg').split(',').map(x=>x.trim()).filter(Boolean),imgs:old.imgs||[],cls:old.cls||(cat==='PV'?'p1':'i1')};

 else{CAT[cat].push(np);sel0=cat+'/'+(CAT[cat].length-1);tab='img';flash='Projet ajouté. Ajoute maintenant ses images.'}

function adminBind(){const A=$('#app');
 A.onclick=e=>{const t=e.target,id=t.id,D=t.dataset;

  if(id==='fsave')return fsave();
  if(id==='ct_save'){SITE.liens={linkedin:val('ct_li'),whatsapp:val('ct_wa'),email:val('ct_em')};flash='Liens enregistrés.';saveC();return draw()}
  if(id==='ap_save'){collectAp();flash='À propos enregistré.';saveC();return draw()}
  if(id==='ap_nophoto'){collectAp();SITE.apropos.photo='';saveC();return draw()}
  if(id==='ap_nocv'){collectAp();SITE.apropos.cv='';SITE.apropos.cvnom='';saveC();return draw()}
  if(D.srm!==undefined){SITE.accueil.slides.splice(+D.srm,1);saveC();return draw()}
  if(D.del){if(confirm('Supprimer ce projet ?')){const[k,i]=D.del.split('/');CAT[k].splice(+i,1);flash='Projet supprimé.';saveC();draw()}return}
  if(D.rm!==undefined){ref(sel0).imgs.splice(+D.rm,1);saveC();return draw()}
  if(id==='a_save'){collectA();flash='Accueil enregistré.';saveC();return draw()}
  if(id==='a_nophoto'){collectA();SITE.accueil.photo='';saveC();return draw()}
  if(id==='p_save'){['elec','pv','pubs'].forEach(k=>{SITE[k].titre=val('p_'+k+'_t');SITE[k].sous=val('p_'+k+'_s')});const c=val('p_cats').split(',').map(x=>x.trim()).filter(Boolean);if(c.length)SITE.pubs.cats=c;flash='Titres enregistrés.';saveC();return draw()}
  if(id==='u_save')return usave();
  if(D.pe!==undefined){pidx=+D.pe;pfile=null;return draw()}
  if(D.pd!==undefined){if(confirm('Supprimer cette publication ?')){PUBS.splice(+D.pd,1);pidx=null;flash='Publication supprimée.';saveC();draw()}return}
  if(id==='u_new'){pidx=null;pfile=null;return draw()}
  if(id==='f_none'){FONDS[fkey]=null;saveC();return draw()}
  if(id==='aexp')return exportC();
  if(id==='areset'&&confirm('Revenir au contenu du fichier contenu.js ?')){try{localStorage.removeItem(PK)}catch(x){}location.reload()}
 };
 A.onchange=async e=>{const t=e.target,id=t.id,f0=t.files&&t.files[0];
  if(id==='asel'){sel0=t.value;flash='';return draw()}
  if(id==='ct_li'||id==='ct_wa'||id==='ct_em'){SITE.liens={linkedin:val('ct_li'),whatsapp:val('ct_wa'),email:val('ct_em')};saveC();foot();return}
  if(id==='s_img'){const h=SITE.accueil;h.slides=h.slides||[];for(const f of t.files)h.slides.push(await shrink(f,1000));flash=t.files.length+' image(s) ajoutée(s) au défilement.';saveC();return draw()}
  if(id==='s_proj'){SITE.accueil.inclureProjets=t.checked;saveC();return}
  if(id==='ap_photo'&&f0){collectAp();SITE.apropos.photo=await shrink(f0,500);saveC();return draw()}
  if(id==='ap_cv'&&f0){collectAp();if(f0.size>2e6){flash='CV trop lourd (2 Mo max) : mets-le dans le dossier documents/ et écris son chemin dans le champ ci-dessus.';return draw()}const r=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f0)});SITE.apropos.cv=r;SITE.apropos.cvnom=f0.name;flash='CV intégré.';saveC();return draw()}
  if(id==='aimg'){const p=ref(sel0);p.imgs=p.imgs||[];for(const f of t.files)p.imgs.push(await shrink(f));flash=t.files.length+' image(s) ajoutée(s).';saveC();return draw()}
  if(id==='a_photo'&&f0){collectA();SITE.accueil.photo=await shrink(f0,500);saveC();return draw()}
  if(id==='u_up'&&f0){if(f0.size>2e6){$('#am').textContent='PDF trop lourd (2 Mo max) : mets-le dans le dossier documents/ et écris son chemin.';return}const r=new FileReader();r.onload=()=>{pfile=r.result;$('#am').textContent='PDF prêt : clique sur Enregistrer.'};r.readAsDataURL(f0);return}
  if(id==='f_k'){fkey=t.value;return draw()}
  if(id==='f_img'&&f0){const f=FONDS[fkey]||{};FONDS[fkey]={src:await shrink(f0,1600),pos:f.pos||'center',light:f.light||0};saveC();return draw()}
  if(id==='f_pos'){FONDS[fkey].pos='center '+t.value+'%';saveC();return draw()}
  if(id==='f_light'){FONDS[fkey].light=t.checked?1:0;saveC();return draw()}
 };
}
